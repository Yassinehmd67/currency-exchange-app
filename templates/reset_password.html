<!DOCTYPE html>
<html lang="{{ session.get('lang','ar') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{{ 'Set new password' if session.get('lang')=='en' else 'تعيين كلمة مرور جديدة' }}</title>

    <style>
        body{
            font-family:'Cairo',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
            background:#f4f6f8;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
            padding:24px;
            direction:{{ 'rtl' if session.get('lang','ar')=='ar' else 'ltr' }};
        }

        .box{
            background:#fff;
            width:360px;
            max-width:92vw;
            padding:30px;
            border-radius:14px;
            box-shadow:0 4px 14px rgba(0,0,0,.1);
            text-align:center;
        }

        h2{
            color:#2c3e50;
            margin:0 0 20px;
            font-size:22px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-bottom:15px;
            font-size:15px;
            box-sizing:border-box;
        }

        input:focus{
            outline:none;
            border-color:#3498db;
            box-shadow:0 0 0 2px rgba(52,152,219,.15);
        }

        button{
            width:100%;
            padding:12px;
            background:#3498db;
            color:#fff;
            border-radius:8px;
            border:none;
            font-size:16px;
            cursor:pointer;
        }
        button:hover{background:#2980b9;}

        .flash{
            margin-bottom:10px;
            font-size:14px;
            text-align:center;
        }

        /* ==========================
           Responsive (Mobile)
           ========================== */
        @media (max-width: 520px){
            body{
                padding:16px;
                align-items:flex-start;
            }
            .box{
                width:100%;
                padding:20px 16px;
                margin-top:18px;
                border-radius:14px;
            }
            h2{
                font-size:20px;
                margin-bottom:16px;
            }
            input{
                padding:12px;
                font-size:15px;
            }
            button{
                padding:12px;
                font-size:15px;
            }
        }

        @media (max-width: 360px){
            body{ padding:12px; }
            .box{ padding:18px 14px; }
            h2{ font-size:19px; }
        }
    </style>
</head>
<body>

<div class="box">
    <h2>{{ 'Set a new password' if session.get('lang')=='en' else 'تعيين كلمة مرور جديدة' }}</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p class="flash {{ category }}">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('reset_password', token=token) }}" method="POST">
        <input
            type="password"
            name="password"
            placeholder="{{ 'New password' if session.get('lang')=='en' else 'كلمة المرور الجديدة' }}"
            required
            minlength="8"
            autocomplete="new-password"
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="{{ 'Confirm password' if session.get('lang')=='en' else 'تأكيد كلمة المرور' }}"
            required
            minlength="8"
            autocomplete="new-password"
        >

        <button type="submit">
            {{ 'Save new password' if session.get('lang')=='en' else 'حفظ كلمة المرور' }}
        </button>
    </form>
</div>

</body>
</html>
