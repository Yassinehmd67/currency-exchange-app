<!DOCTYPE html>
<html lang="{{ session.get('lang','ar') }}" dir="{{ 'rtl' if session.get('lang','ar')=='ar' else 'ltr' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{{ 'Set new password' if session.get('lang')=='en' else 'تعيين كلمة مرور جديدة' }}</title>

</head>
<body class="auth-page">

<div class="box">
    <h2>{{ 'Set a new password' if session.get('lang')=='en' else 'تعيين كلمة مرور جديدة' }}</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p class="flash {{ category }}">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('reset_password', token=token) }}" method="POST">
        <input
            type="password"
            name="password"
            placeholder="{{ 'New password' if session.get('lang')=='en' else 'كلمة المرور الجديدة' }}"
            required
            minlength="8"
            autocomplete="new-password"
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="{{ 'Confirm password' if session.get('lang')=='en' else 'تأكيد كلمة المرور' }}"
            required
            minlength="8"
            autocomplete="new-password"
        >

        <button type="submit">
            {{ 'Save new password' if session.get('lang')=='en' else 'حفظ كلمة المرور' }}
        </button>
    </form>
</div>

</body>
</html>
