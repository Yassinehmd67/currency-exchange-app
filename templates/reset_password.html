<!DOCTYPE html>
<html lang="{{ session.get('lang','ar') }}">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Set new password' if session.get('lang')=='en' else 'تعيين كلمة مرور جديدة' }}</title>
    <style>
        body{
            font-family:'Cairo',sans-serif;
            background:#f4f6f8;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            margin:0;
            direction:{{ 'rtl' if session.get('lang','ar')=='ar' else 'ltr' }};
        }
        .box{
            background:#fff;
            width:360px;
            padding:30px;
            border-radius:14px;
            box-shadow:0 4px 14px rgba(0,0,0,.1);
            text-align:center;
        }
        h2{color:#2c3e50;margin-bottom:20px;font-size:22px;}
        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-bottom:15px;
            font-size:15px;
        }
        button{
            width:100%;
            padding:12px;
            background:#3498db;
            color:#fff;
            border-radius:8px;
            border:none;
            font-size:16px;
            cursor:pointer;
        }
        button:hover{background:#2980b9;}
        .flash{color:#e74c3c;margin-bottom:10px;font-size:14px;}
    </style>
</head>
<body>

<div class="box">
    <h2>{{ 'Set a new password' if session.get('lang')=='en' else 'تعيين كلمة مرور جديدة' }}</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p class="flash">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('reset_password', token=token) }}" method="POST">
        <input type="password" name="password"
               placeholder="{{ 'New password' if session.get('lang')=='en' else 'كلمة المرور الجديدة' }}" required>
        <input type="password" name="confirm_password"
               placeholder="{{ 'Confirm password' if session.get('lang')=='en' else 'تأكيد كلمة المرور' }}" required>
        <button type="submit">
            {{ 'Save new password' if session.get('lang')=='en' else 'حفظ كلمة المرور' }}
        </button>
    </form>
</div>

</body>
</html>
