<!DOCTYPE html>
<html lang="{{ session.get('lang','ar') }}">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ t('about_app') }}</title>
  <style>
    body{
      font-family:system-ui,"Cairo",sans-serif;
      margin:0;
      background:#f7f7f9;
      direction: {{ 'rtl' if session.get('lang','ar')=='ar' else 'ltr' }};
    }
    header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:12px 16px;
      background:#111;
      color:#fff;
    }
    header a{
      color:#9ad;
      text-decoration:none;
      margin-inline:8px;
    }
    main{
      max-width:900px;
      margin:24px auto;
      padding:0 12px;
    }
    .card{
      background:#fff;
      border:1px solid #e8e8ef;
      border-radius:14px;
      padding:16px;
      box-shadow:0 2px 10px rgba(0,0,0,.03);
      margin-bottom:16px;
    }
    h1,h2{margin:6px 0 12px}
    ul{margin:0;padding-inline-start:22px}
    li{margin:6px 0}
    .muted{opacity:.85}
  </style>
</head>
<body>
<header>
  <div>
    <a href="{{ url_for('index') }}">← {{ t('home') }}</a>
  </div>
  <div>{{ t('about_app') }}</div>
  <div><!-- مكان فارغ كان فيه notifications --></div>
</header>

<main>
  <section class="card">
    <h2>ℹ️ {{ t('about_app') }}</h2>
    <ul class="muted">
      {% for point in t('about_app_points') %}
        <li>{{ point }}</li>
      {% endfor %}
    </ul>
  </section>
</main>
</body>
</html>
